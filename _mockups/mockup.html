<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mealwise — Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,16..72,400;0,16..72,500;0,16..72,600;1,16..72,400;1,16..72,500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #eef0ec; }
  #stage {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(125% 90% at 50% -10%, #f4f6f1 0%, #e7eae4 62%, #e0e4dd 100%);
  }

  /* ════════ THEME TOKENS ════════ */
  .theme-a {
    --green: #1f8a5b; --green-press: #176b46; --on-green: #ffffff;
    --ink: #18241e; --muted: #8a8f86; --muted-2: #aeb4aa;
    --bg: #faf8f3; --card: #ffffff; --line: #e8e5dc; --line-soft: #f0ede5;
    --accent: #e8a44a; --tint: #eef5f0;
    --pill-radius: 999px; --card-radius: 20px; --btn-radius: 17px;
    --h-font: 'Plus Jakarta Sans', system-ui, sans-serif;
    --b-font: 'Plus Jakarta Sans', system-ui, sans-serif;
    --h-weight: 500; --h-emph: 800; --h-emph-style: normal;
    --h-size: 28px; --h-tracking: -0.02em; --h-leading: 1.16;
  }
  .theme-b {
    --green: #1f8a5b; --green-press: #176b46; --on-green: #ffffff;
    --ink: #18241e; --muted: #8a8f86; --muted-2: #aeb4aa;
    --bg: #ffffff; --card: #ffffff; --line: #e7e4dc; --line-soft: #f2efe9;
    --accent: #1f8a5b; --tint: #eef5f0;
    --pill-radius: 11px; --card-radius: 13px; --btn-radius: 12px;
    --h-font: 'Plus Jakarta Sans', system-ui, sans-serif;
    --b-font: 'Plus Jakarta Sans', system-ui, sans-serif;
    --h-weight: 500; --h-emph: 800; --h-emph-style: normal;
    --h-size: 28px; --h-tracking: -0.02em; --h-leading: 1.16;
  }

  .app { position: relative; width: 100%; height: 100%; }

  /* ════════ SCREEN SHELL ════════ */
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    padding-top: 60px;
    background: var(--bg);
    font-family: var(--b-font);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    animation: screenIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes screenIn { from { transform: translateX(15px); } to { transform: translateX(0); } }
  @keyframes screenInBack { from { transform: translateX(-15px); } to { transform: translateX(0); } }
  .screen.back { animation-name: screenInBack; }
  .ob-body, .welcome-content, .home-body { animation: fadeUp 0.46s ease both; }
  @keyframes fadeUp { from { opacity: 0.35; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* ════════ TOP BAR ════════ */
  .ob-top { display: flex; align-items: center; gap: 14px; padding: 6px 24px 12px; flex-shrink: 0; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--card);
    box-shadow: 0 1px 2px rgba(20,40,30,.05), 0 0 0 1px var(--line);
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    transition: transform .12s ease;
  }
  .icon-btn:active { transform: scale(.92); }
  .progress-track { flex: 1; display: flex; gap: 5px; align-items: center; }
  .seg-dot { flex: 1; height: 5px; border-radius: 3px; background: var(--line); transition: background .4s ease; }
  .seg-dot.on { background: var(--green); }
  .skip-btn { border: none; background: none; font-family: var(--b-font); font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; padding: 8px 2px; flex-shrink: 0; }
  .skip-btn:active { color: var(--ink); }

  /* ════════ BODY / TYPE ════════ */
  .ob-body { flex: 1; overflow: hidden; padding: 12px 26px 6px; }
  .head-block { margin-bottom: 4px; }
  .eyebrow {
    font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--green); margin-bottom: 12px;
  }
  .theme-b .eyebrow { font-weight: 600; letter-spacing: .14em; }
  .headline {
    font-family: var(--h-font); font-size: var(--h-size); line-height: var(--h-leading);
    font-weight: var(--h-weight); letter-spacing: var(--h-tracking); color: var(--ink); margin: 0; text-wrap: balance;
  }
  .headline b { font-weight: var(--h-emph); font-style: var(--h-emph-style); }
  .sub { font-size: 14.5px; line-height: 1.5; color: var(--muted); margin: 12px 0 0; font-weight: 400; max-width: 94%; text-wrap: pretty; }
  .theme-b .sub { font-size: 15px; }

  .field-label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); margin: 26px 0 11px; display: flex; align-items: baseline; gap: 9px; }
  .theme-b .field-label { font-weight: 600; letter-spacing: .1em; color: var(--muted); }
  .field-hint { font-size: 11.5px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted-2); }

  /* ════════ PILLS ════════ */
  .pill-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 10px 15px;
    border-radius: var(--pill-radius); background: var(--card); border: 1.5px solid var(--line);
    font-family: var(--b-font); font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer;
    transition: all .15s ease; user-select: none; line-height: 1.1;
  }
  .pill:active { transform: scale(.96); }
  .pill.selected { background: var(--green); border-color: var(--green); color: var(--on-green); box-shadow: 0 4px 12px rgba(31,138,91,.22); }
  .theme-b .pill.selected { box-shadow: 0 3px 10px rgba(31,138,91,.2); }
  .pill.add { border-style: dashed; border-color: var(--green); color: var(--green); background: var(--tint); }
  .pill.ghost { color: var(--ink); border-color: var(--line); background: var(--card); font-weight: 600; }
  .add-input { display: inline-flex; align-items: center; border-radius: var(--pill-radius); border: 1.5px solid var(--green); background: var(--card); padding: 0 5px 0 15px; box-shadow: 0 4px 12px rgba(31,138,91,.12); }
  .add-input input { border: none; outline: none; font-family: var(--b-font); font-size: 14px; font-weight: 600; color: var(--ink); background: transparent; width: 108px; padding: 9px 0; }
  .add-input button { width: 28px; height: 28px; border-radius: 50%; border: none; background: var(--green); color: var(--on-green); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  /* ════════ SEGMENTED ════════ */
  .seg { display: flex; gap: 4px; padding: 4px; background: var(--card); border: 1.5px solid var(--line); border-radius: var(--pill-radius); }
  .seg-btn {
    flex: 1; padding: 12px 6px; border: none; background: transparent; border-radius: calc(var(--pill-radius) - 4px);
    font-family: var(--b-font); font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .16s ease;
  }
  .theme-b .seg-btn { border-radius: 8px; }
  .seg-btn:active { transform: scale(.97); }
  .seg-btn.on { background: var(--green); color: var(--on-green); box-shadow: 0 3px 9px rgba(31,138,91,.22); }

  /* ════════ KCAL ════════ */
  .kcal-card { margin-top: 11px; background: var(--tint); border: 1.5px solid var(--line); border-radius: var(--card-radius); padding: 15px 18px; display: flex; align-items: center; justify-content: space-between; animation: fadeUp .3s ease; }
  .kcal-label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .kcal-value { font-size: 24px; font-weight: 800; color: var(--ink); margin-top: 1px; font-family: var(--b-font); }
  .theme-b .kcal-value { font-weight: 700; }
  .kcal-value span { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 4px; }
  .stepper { display: flex; align-items: center; gap: 9px; }
  .step-btn { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card); font-size: 21px; color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .12s ease; }
  .step-btn:active { transform: scale(.9); }
  .step-btn.plus { background: var(--green); border-color: var(--green); color: var(--on-green); }

  /* ════════ TEXTAREA ════════ */
  .ta-wrap { margin-top: 6px; background: var(--card); border: 1.5px solid var(--line); border-radius: var(--card-radius); padding: 15px 17px; transition: border-color .16s ease; }
  .ta-wrap:focus-within { border-color: var(--green); }
  .ta-wrap textarea { width: 100%; border: none; outline: none; resize: none; font-family: var(--b-font); font-size: 15px; line-height: 1.5; color: var(--ink); background: transparent; min-height: 104px; }
  .ta-wrap textarea::placeholder { color: var(--muted-2); }

  /* ════════ IDENTITY ════════ */
  .auth-card { margin-top: 24px; background: var(--card); border: 1.5px solid var(--line); border-radius: var(--card-radius); padding: 16px 17px; box-shadow: 0 6px 18px rgba(20,40,30,.04); }
  .auth-label { display: block; font-size: 11.5px; line-height: 1; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .auth-input { width: 100%; border: none; outline: none; background: transparent; color: var(--ink); font-family: var(--b-font); font-size: 17px; line-height: 1.35; font-weight: 650; padding: 0; }
  .auth-input::placeholder { color: var(--muted-2); font-weight: 600; }

  /* ════════ FOOTER / CTA ════════ */
  .ob-foot { flex-shrink: 0; padding: 12px 26px 30px; background: linear-gradient(to top, var(--bg) 74%, transparent); }
  .btn { width: 100%; height: 54px; border-radius: var(--btn-radius); border: none; font-family: var(--b-font); font-size: 16.5px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 9px; transition: transform .12s ease; }
  .btn-primary { background: var(--green); color: var(--on-green); box-shadow: 0 8px 20px rgba(31,138,91,.26); }
  .btn-primary:active { transform: scale(.98); }

  /* ════════ WELCOME ════════ */
  .welcome { justify-content: space-between; padding: 60px 28px 32px; }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--green); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(31,138,91,.3); }
  .theme-b .brand-mark { border-radius: 8px; }
  .brand-name { font-size: 18px; font-weight: 800; color: var(--ink); letter-spacing: -0.02em; font-family: var(--b-font); }
  .welcome-art { flex: 1; display: flex; align-items: center; justify-content: center; }
  .welcome-content .headline { font-size: calc(var(--h-size) + 5px); }
  .welcome-content .btn-primary { margin-top: 24px; }
  .welcome-secondary { text-align: center; color: var(--muted); font-size: 14px; margin-top: 15px; }
  .welcome-secondary b { color: var(--green); font-weight: 700; }

  /* plan preview (welcome art) */
  .plan-card { width: 252px; background: var(--card); border: 1.5px solid var(--line); border-radius: 22px; padding: 16px; box-shadow: 0 20px 50px rgba(20,40,30,.1); transform: rotate(-2deg); }
  .theme-b .plan-card { border-radius: 14px; transform: rotate(-1.5deg); }
  .plan-head { margin-bottom: 13px; }
  .plan-chip { font-size: 11px; font-weight: 700; color: var(--green); background: var(--tint); padding: 5px 11px; border-radius: 999px; }
  .theme-b .plan-chip { border-radius: 6px; font-weight: 600; }
  .plan-row { display: flex; align-items: center; gap: 11px; padding: 9px 0; border-top: 1px solid var(--line-soft); }
  .plan-ico { width: 34px; height: 34px; border-radius: 10px; background: var(--tint); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .theme-b .plan-ico { border-radius: 8px; }
  .plan-lines { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .plan-line { height: 7px; border-radius: 4px; background: var(--ink); opacity: .82; }
  .plan-line.short { width: 46%; opacity: .26; height: 6px; }
  .plan-kcal { width: 30px; height: 7px; border-radius: 4px; background: var(--accent); opacity: .7; flex-shrink: 0; }
  .plan-total { display: flex; justify-content: space-between; align-items: center; margin-top: 11px; padding-top: 12px; border-top: 1.5px solid var(--line); }

  /* ════════ DONE ════════ */
  .done-icon { width: 70px; height: 70px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; margin: 4px 0 22px; box-shadow: 0 12px 28px rgba(31,138,91,.3); animation: pop .5s cubic-bezier(0.22, 1.4, 0.4, 1) both; }
  @keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }
  .summary { margin-top: 22px; background: var(--card); border: 1.5px solid var(--line); border-radius: var(--card-radius); overflow: hidden; }
  .sum-row { display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line-soft); }
  .sum-row:last-child { border-bottom: none; }
  .sum-ico { width: 32px; height: 32px; border-radius: 9px; background: var(--tint); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .theme-b .sum-ico { border-radius: 7px; }
  .sum-k { font-size: 11.5px; color: var(--muted); font-weight: 600; display: block; text-transform: uppercase; letter-spacing: .05em; }
  .sum-v { font-size: 14px; color: var(--ink); font-weight: 600; margin-top: 2px; line-height: 1.35; display: block; }

  /* ════════ HOME ════════ */
  .home { padding-top: 60px; }
  .home-top { display: flex; align-items: center; justify-content: space-between; padding: 6px 24px 4px; flex-shrink: 0; }
  .home-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--green); color: var(--on-green); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; font-family: var(--b-font); }
  .home-body { flex: 1; overflow: hidden; padding: 16px 26px 6px; }
  .home-greet { font-size: 15px; color: var(--muted); font-weight: 500; margin-bottom: 8px; }
  .home .headline { font-size: calc(var(--h-size) + 2px); }
  .prompt { margin-top: 22px; display: flex; align-items: center; gap: 10px; background: var(--card); border: 1.5px solid var(--line); border-radius: var(--card-radius); padding: 7px 7px 7px 18px; box-shadow: 0 6px 18px rgba(20,40,30,.05); }
  .prompt-text { flex: 1; color: var(--muted-2); font-size: 14.5px; }
  .prompt-send { width: 42px; height: 42px; border-radius: calc(var(--card-radius) - 7px); border: none; background: var(--green); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .today-plan-card { width: 100%; margin-top: 22px; padding: 14px; border: 1.5px solid var(--line); border-radius: var(--card-radius); background: #f7f5ef; text-align: left; font-family: var(--b-font); cursor: pointer; }
  .today-plan-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .today-plan-kicker { color: var(--green); font-size: 10.5px; line-height: 1; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
  .today-plan-title { color: var(--ink); font-size: 16px; line-height: 1.2; font-weight: 800; }
  .today-plan-meta { color: var(--muted); font-size: 12.5px; line-height: 1.3; font-weight: 600; margin-top: 4px; }
  .today-plan-total { color: var(--ink); font-size: 17px; line-height: 1; font-weight: 800; text-align: right; flex-shrink: 0; }
  .today-plan-total span { display: block; color: var(--muted-2); font-size: 10px; line-height: 1.2; margin-top: 6px; }
  .today-plan-meals { display: flex; gap: 6px; margin-top: 12px; }
  .today-plan-meals span { flex: 1; border-radius: 8px; background: #fff; color: var(--muted); padding: 7px 5px; font-size: 10.5px; line-height: 1; font-weight: 800; text-align: center; }
  .home-nav { flex-shrink: 0; display: flex; justify-content: space-around; padding: 12px 12px 28px; border-top: 1px solid var(--line-soft); background: var(--card); }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; border: none; background: none; cursor: pointer; font-family: var(--b-font); font-size: 10.5px; font-weight: 600; color: var(--muted-2); padding: 4px 8px; min-width: 70px; }
  .nav-item.on { color: var(--green); }
  .nav-item:disabled { cursor: default; opacity: 1; }

  /* ════════ HISTORY ════════ */
  .history { padding-top: 95px; background: #fff; }
  .history-body { flex: 1; overflow: auto; padding: 6px 26px 12px; }
  .history-title { font-size: 27px; line-height: 1.06; font-weight: 800; letter-spacing: -0.02em; margin: 0; color: var(--ink); }
  .history-sub { margin: 6px 0 26px; color: #8a8f86; font-size: 13.5px; line-height: 1.25; font-weight: 500; }
  .day-section { margin-top: 20px; }
  .day-section:first-of-type { margin-top: 0; }
  .day-head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 10px; }
  .day-label { color: #18241e; font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
  .day-total { color: #7f857e; font-size: 12px; font-weight: 600; }
  .meal-list { background: rgba(255,255,255,.72); border: 1.5px solid #e7e4dc; border-radius: 13px; overflow: hidden; }
  .meal-row { min-height: 76px; display: grid; grid-template-columns: 40px minmax(0, 1fr) 54px; gap: 9px; align-items: center; padding: 13px 15px; border-bottom: 1.5px solid #e7e4dc; }
  .meal-row:last-child { border-bottom: none; }
  .meal-ico { width: 36px; height: 36px; border-radius: 8px; background: #eef6f0; display: flex; align-items: center; justify-content: center; color: var(--green); }
  .meal-main { min-width: 0; }
  .meal-type { display: block; color: var(--green); font-size: 10.5px; line-height: 1.05; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; margin-bottom: 3px; }
  .meal-name { display: block; color: #18241e; font-size: 14.5px; line-height: 1.25; font-weight: 700; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meal-macros { display: block; color: #858b83; font-size: 11.5px; line-height: 1.15; font-weight: 600; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meal-kcal { text-align: right; color: var(--ink); font-size: 16px; line-height: 1; font-weight: 800; }
  .meal-kcal span { display: block; color: #a2a69f; font-size: 10px; line-height: 1.2; font-weight: 700; margin-top: 7px; }

  /* ════════ AUTH (REGISTER FLOW) ════════ */
  .auth-step { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted-2); margin-left: 2px; }
  .auth-badge { width: 56px; height: 56px; border-radius: 13px; background: var(--tint); border: 1.5px solid var(--line); display: flex; align-items: center; justify-content: center; margin: 2px 0 20px; animation: pop .5s cubic-bezier(0.22, 1.4, 0.4, 1) both; }
  .input-field { margin-top: 26px; display: flex; align-items: center; gap: 12px; background: var(--card); border: 1.5px solid var(--line); border-radius: var(--card-radius); padding: 4px 18px; transition: border-color .16s ease, box-shadow .16s ease; }
  .input-field:focus-within { border-color: var(--green); box-shadow: 0 6px 18px rgba(31,138,91,.08); }
  .input-field .fi-ico { color: var(--muted-2); display: flex; flex-shrink: 0; transition: color .16s ease; }
  .input-field:focus-within .fi-ico { color: var(--green); }
  .input-field input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: var(--b-font); font-size: 18px; font-weight: 600; color: var(--ink); padding: 18px 0; }
  .input-field input::placeholder { color: var(--muted-2); font-weight: 500; }
  .auth-note { margin: 14px 0 0; text-align: center; font-size: 11.5px; line-height: 1.5; color: var(--muted-2); }
  .auth-note b { color: var(--muted); font-weight: 600; }
  .email-strong { color: var(--ink); font-weight: 700; }
  .otp-row { display: flex; gap: 9px; margin-top: 26px; }
  .otp-box { flex: 1; min-width: 0; height: 62px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); text-align: center; font-family: var(--b-font); font-size: 26px; font-weight: 700; color: var(--ink); outline: none; transition: all .16s ease; }
  .otp-box:focus { border-color: var(--green); box-shadow: 0 6px 18px rgba(31,138,91,.12); }
  .otp-box.filled { border-color: var(--green); background: var(--tint); }
  .resend-row { margin-top: 22px; text-align: center; font-size: 13.5px; color: var(--muted); }
  .resend-row button { border: none; background: none; padding: 0; font-family: var(--b-font); font-size: 13.5px; font-weight: 700; color: var(--green); cursor: pointer; }
  .btn-primary:disabled { opacity: .42; box-shadow: none; cursor: default; }
  .btn-primary:disabled:active { transform: none; }

  /* ════════ PLANNING FLOW ════════ */
  .plan-screen { padding-top: 60px; background: #fff; }

      kcal: sum.kcal + meal.kcal,
      p: sum.p + meal.p,
      f: sum.f + meal.f,
      c: sum.c + meal.c,
    }), { kcal: 0, p: 0, f: 0, c: 0 });
  }

  function scaleAmount(amount, factor) {
    if (!factor || factor === 1) return amount;
    const text = String(amount);
    const match = text.match(/^\s*(\d+(?:\.\d+)?|\d+\/\d+)\s*([\s\S]*)$/);
    if (!match) return amount;
    const raw = match[1];
    const rest = match[2] || '';
    const value = raw.includes('/')
      ? raw.split('/').reduce((a, b) => Number(a) / Number(b))
      : Number(raw);
    const scaled = value * factor;
    const rounded = Math.round(scaled * 10) / 10;
    const display = Number.isInteger(rounded) ? String(rounded) : String(rounded).replace('.5', '.5');
    const suffix = rest.trim();
    return `${display}${suffix ? `${/^[,.]/.test(suffix) ? '' : ' '}${suffix}` : ''}`;

  function device(children) {
    return `
      <div style="width:402px;height:874px;border-radius:48px;overflow:hidden;position:relative;background:#F2F2F7;box-shadow:0 40px 80px rgba(0,0,0,0.18),0 0 0 1px rgba(0,0,0,0.12);font-family:-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;">
        <div style="position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:24px;background:#000;z-index:50;"></div>
        <div style="position:absolute;top:0;left:0;right:0;z-index:10;">${statusBar()}</div>
        <div style="height:100%;display:flex;flex-direction:column;">
          <div style="flex:1;overflow:auto;">${children}</div>
        </div>
        <div style="position:absolute;bottom:0;left:0;right:0;z-index:60;height:34px;display:flex;justify-content:center;align-items:flex-end;padding-bottom:8px;pointer-events:none;">
          <div style="width:139px;height:5px;border-radius:100px;background:rgba(0,0,0,0.25);"></div>
        </div>
      </div>`;
  }

  function header(eyebrow, title, sub) {
    return `
      <div class="head-block">
        ${eyebrow ? `<div class="eyebrow">${esc(eyebrow)}</div>` : ''}
        <h1 class="headline">${title}</h1>
        ${sub ? `<p class="sub">${esc(sub)}</p>` : ''}
      </div>`;
  }

  function fieldLabel(text, hint = '') {
    return `<div class="field-label">${esc(text)}${hint ? `<span class="field-hint">${esc(hint)}</span>` : ''}</div>`;
  }

  function primaryButton(label, action, disabled = false) {
    return `<button class="btn btn-primary" data-action="${esc(action)}"${disabled ? ' disabled' : ''}>${esc(label)}${icon('arrow', 'var(--on-green)', 17)}</button>`;
  }

  function authTop(label) {
    return `
      <div class="ob-top">
        <button class="icon-btn" data-action="back" aria-label="Back">${icon('back', 'var(--ink)', 18)}</button>
        <div class="progress-track"><span class="auth-step">${esc(label)}</span></div>
        <div style="width:40px"></div>
      </div>`;
  }

  function promptInput(id, value, placeholder, hero = false) {
    return `
      <div class="prompt2${hero ? ' hero' : ''}">
        <textarea id="${esc(id)}" rows="1" placeholder="${esc(placeholder)}">${esc(value || '')}</textarea>
        <button class="prompt-send" data-action="${id === 'home-prompt' ? 'prompt-send' : 'followup-send'}" aria-label="Send">${icon('send', 'var(--on-green)', 18)}</button>
      </div>`;
  }

  function macroBars(meal) {
    const max = Math.max(meal.p, meal.f, meal.c) || 1;
    return `
      <div class="macro-row">
        ${[
          ['Protein', meal.p, 1],
          ['Fat', meal.f, .5],
          ['Carbs', meal.c, .26],
        ].map(([label, value, opacity]) => `
          <div class="macro">
            <div class="macro-v">${value}<span>g</span></div>
            <div class="macro-bar"><span style="width:${(value / max) * 100}%;opacity:${opacity}"></span></div>
            <div class="macro-k">${label}</div>
          </div>`).join('')}
      </div>`;
  }

  function skeletonCard(label = '') {
    return `
      <div class="pmeal skel">
        <div class="pmeal-top">
          <span class="pmeal-ico sk-ico"></span>
          <div class="pmeal-head">
            <span class="sk-line" style="width:38%;height:9px"></span>
            <span class="sk-line" style="width:72%;height:13px;margin-top:9px"></span>
          </div>
        </div>
        <span class="sk-line" style="width:100%;margin-top:14px"></span>
        <span class="sk-line" style="width:84%;margin-top:7px"></span>
        <div class="macro-row" style="margin-top:14px">
          <div class="macro sk"><span class="sk-line" style="width:60%;height:13px"></span><span class="sk-line" style="width:100%;margin-top:8px"></span></div>
          <div class="macro sk"><span class="sk-line" style="width:60%;height:13px"></span><span class="sk-line" style="width:100%;margin-top:8px"></span></div>
          <div class="macro sk"><span class="sk-line" style="width:60%;height:13px"></span><span class="sk-line" style="width:100%;margin-top:8px"></span></div>
        </div>
        ${label ? `<div class="revising-tag"><span class="dot-pulse"><i></i><i></i><i></i></span>${esc(label)}</div>` : ''}
      </div>`;
  }

  function bottomNav(active) {
    return `
      <div class="home-nav">
        ${NAV.map((item) => {
          const on = item.id === active;
          const action = item.id === 'plans' || item.id === 'history' ? ` data-action="tab" data-tab="${esc(item.id)}"` : ' disabled';
          return `<button class="nav-item${on ? ' on' : ''}"${action}>${icon(item.i, on ? 'var(--green)' : 'var(--muted-2)', 22)}<span>${esc(item.l)}</span></button>`;
        }).join('')}
      </div>`;
  }

  function pill(label, selected, action, extra = '') {
    return `<button class="pill${selected ? ' selected' : ''}${extra ? ` ${extra}` : ''}" data-action="${esc(action)}" data-value="${esc(label)}">${extra === 'add' ? icon('plus', 'var(--green)', 15) : ''}${esc(label)}</button>`;
  }

  function segmented(options, value, field) {
    return `
      <div class="seg">
        ${options.map((option) => `<button class="seg-btn${value === option.id ? ' on' : ''}" data-action="segment" data-field="${esc(field)}" data-value="${esc(option.id)}">${esc(option.label)}</button>`).join('')}
      </div>`;
  }

  function shell(qIndex, body, foot, total = 6) {
    return `
      <div class="ob-top">
        <button class="icon-btn" data-action="back" aria-label="Back">${icon('back', 'var(--ink)', 18)}</button>
        <div class="progress-track">
          ${Array.from({ length: total }, (_, i) => `<span class="seg-dot${i < qIndex ? ' on' : ''}"></span>`).join('')}
        </div>
        <button class="skip-btn" data-action="skip">Skip</button>
      </div>
      <div class="ob-body">${body}</div>
      <div class="ob-foot">${foot}</div>`;
  }

  function planPreview() {
    const rows = [{ i: 'bowl', w: 78 }, { i: 'leaf', w: 64 }, { i: 'pan', w: 82 }];
    return `
      <div class="plan-card">
        <div class="plan-head"><span class="plan-chip">Today · Asian, cheat day</span></div>
        ${rows.map((row) => `
          <div class="plan-row">
            <span class="plan-ico">${icon(row.i, 'var(--green)', 18)}</span>
            <span class="plan-lines"><span class="plan-line" style="width:${row.w}%"></span><span class="plan-line short"></span></span>
            <span class="plan-kcal"></span>
          </div>`).join('')}
        <div class="plan-total"><span class="plan-line" style="width:34%"></span><span class="plan-line" style="width:18%"></span></div>
      </div>`;
  }

  function welcomeScreen() {
    return `
      <div class="screen welcome">
        <div class="brand">
          <span class="brand-mark">${icon('leaf', 'var(--on-green)', 20)}</span>

        <div class="welcome-content">
          <h1 class="headline">Plan meals by<br><b>simply asking.</b></h1>
          <p class="sub">Tell Mealwise what you feel like. It builds a structured plan, remembers your taste, and keeps your history.</p>
          ${primaryButton('Get started', 'next')}
          <div class="welcome-secondary">Already a member? <b>Sign in</b></div>
        </div>
      </div>`;
  }

  function emailScreen() {
    const email = app.data.email || '';
    const valid = emailValid(email);
    return `
      <div class="screen${app.dir === 'back' ? ' back' : ''}">
        ${authTop('Create account')}
        <div class="ob-body">
          <div class="auth-badge">${icon('mail', 'var(--green)', 22)}</div>
          ${header('Welcome to Mealwise', `What's your <b>email?</b>`, "No passwords. We'll email you a one-time code to sign in.")}

            <span class="fi-ico">${icon('mail', 'currentColor', 19)}</span>
            <input id="email-input" type="email" inputmode="email" autocomplete="email" value="${esc(email)}" placeholder="you@email.com">
          </div>
        </div>
        <div class="ob-foot">
          ${primaryButton('Send code', 'next', !valid)}
          <p class="auth-note">By continuing you agree to our <b>Terms</b> &amp; <b>Privacy Policy</b>.</p>
        </div>
      </div>`;
  }

  function codeScreen() {
    const code = app.data.code || '';
    const email = (app.data.email || '').trim() || 'your inbox';
    const filled = code.length === 6;
    return `
      <div class="screen${app.dir === 'back' ? ' back' : ''}">
        ${authTop('Verify')}
        <div class="ob-body">
          <div class="auth-badge">${icon('send', 'var(--green)', 22)}</div>

        <div class="ob-foot">${primaryButton('Verify', 'next', !filled)}</div>
      </div>`;

  function nameScreen() {
    const name = app.data.name || '';
    const body = `

      <div class="auth-card">

    return `<div class="screen${app.dir === 'back' ? ' back' : ''}">${shell(3, body, primaryButton('Continue', 'next'))}</div>`;
  }

  function tastesScreen() {
    const dislikes = app.data.dislikes || [];
    const styles = app.data.styles || [];
    const custom = dislikes.filter((item) => !SUGGESTED.includes(item));
    const addControl = app.adding
      ? `<span class="add-input"><input id="add-dislike-input" value="${esc(app.draft)}" placeholder="Type one..."><button data-action="commit-add">${icon('plus', 'var(--on-green)', 15)}</button></span>`

    const body = `
      ${header('Tastes', `What you'd <b>rather skip.</b>`, "So plans never include what you'd avoid - and match your style.")}
      ${fieldLabel('Avoid', 'optional')}
      <div class="pill-wrap">
        ${custom.map((item) => pill(item, true, 'toggle-dislike')).join('')}
        ${SUGGESTED.map((item) => pill(item, dislikes.includes(item), 'toggle-dislike')).join('')}
        ${addControl}
      </div>
      ${fieldLabel('Eating style')}
      <div class="pill-wrap">
        ${STYLES.map((item) => pill(item, styles.includes(item), 'toggle-style')).join('')}
      </div>`;
    return `<div class="screen${app.dir === 'back' ? ' back' : ''}">${shell(4, body, primaryButton('Continue', 'next'))}</div>`;
  }

      ${fieldLabel('In the kitchen')}
      ${segmented(COOK, app.data.cooking, 'cooking')}
      ${fieldLabel('Healthy swaps', 'how far to lighten a dish')}
      ${segmented(FIT, app.data.fitness, 'fitness')}`;
    return `<div class="screen${app.dir === 'back' ? ' back' : ''}">${shell(5, body, primaryButton('Continue', 'next'))}</div>`;
  }

  function notesScreen() {
    const notes = app.data.notes || '';
    const body = `
      ${header('Notes', 'Anything <b>else?</b>', 'A line to the chef. Optional - Mealwise also learns as you chat.')}

        <textarea id="notes-input" placeholder="e.g. light dinners, love spice, want variety across the week...">${esc(notes)}</textarea>
      </div>

      { i: 'swap', k: 'Swaps', v: FIT_L[app.data.fitness] || 'Not set' },

        <div class="ob-top"><div style="width:40px"></div><div class="progress-track"><span class="seg-dot on"></span><span class="seg-dot on"></span><span class="seg-dot on"></span><span class="seg-dot on"></span><span class="seg-dot on"></span><span class="seg-dot on"></span></div><div style="width:40px"></div></div>

        <div class="ob-foot">${primaryButton('Start planning', 'finish')}</div>

          <span class="home-avatar">${esc(displayInitial())}</span>
        </div>
        <div class="ob-body home-body">
          <div class="home-greet">Hi ${esc(displayName())},</div>
          <h1 class="headline">What do you<br><b>feel like today?</b></h1>
          ${promptInput('home-prompt', app.prompt, 'Give me 3 meals, I feel like Asian...', true)}
          ${hasPlan ? `
            <button class="today-plan-card" data-action="open-today-plan">
              <div class="today-plan-top">
                <div>
                  <div class="today-plan-kicker">Today's plan</div>
                  <div class="today-plan-title">Asian day plan</div>
                  <div class="today-plan-meta">3 meals · ${esc(app.planIntent || 'Asian food')}</div>
                </div>
                <div class="today-plan-total">${totals.kcal.toLocaleString()}<span>kcal</span></div>
              </div>
              <div class="today-plan-meals">
                ${meals.map((meal) => `<span>${esc(meal.type)}</span>`).join('')}
              </div>
            </button>` : ''}
          ${fieldLabel('Quick actions')}
          <div class="pill-wrap">${QUICK.map((item) => `<button class="pill ghost" data-action="start-plan" data-value="${esc(item)}">${esc(item)}</button>`).join('')}</div>
        </div>
        ${bottomNav('plans')}
      </div>`;
  }

  function planningScreen() {
    const totals = planTotals(app.meals.length ? app.meals : INITIAL_MEALS);
    return `
      <div class="screen plan-screen">
        <div class="home-top">
          <button class="icon-btn" data-action="plans-home" aria-label="New plan">${icon('plus', 'var(--ink)', 19)}</button>
          <div class="plan-toptitle"><span>Today's plan</span><span class="plan-topkcal">${totals.kcal.toLocaleString()} kcal · 3 meals</span></div>
          <span class="home-avatar">${esc(displayInitial())}</span>
        </div>
        <div class="plan-scroll">
          <div class="think-banner"><span class="dot-pulse"><i></i><i></i><i></i></span>Planning your meals...</div>
          <div class="plan-list">${[0, 1, 2].map(() => skeletonCard()).join('')}</div>
        </div>
        ${bottomNav('plans')}
      </div>`;
  }

  function ingredientRows(meal) {
    return meal.ing.map((item) => `
      <div class="ing-row">
        <span class="ing-info"><span class="ing-n">${esc(item.name)}</span></span>
        <span class="ing-a">${esc(scaleAmount(item.amount, meal.serves))}</span>
      </div>`).join('');
  }

  function mealCard(meal) {
    const open = !!app.openMeals[meal.id];
    const revised = app.revisedMeal === meal.id || meal.revised;
    return `
      <div class="pmeal${open ? ' open' : ''}${revised ? ' revised' : ''}" data-meal="${esc(meal.id)}">
        <button class="pmeal-tap" data-action="toggle-meal" data-id="${esc(meal.id)}" aria-expanded="${open ? 'true' : 'false'}">
          <div class="pmeal-top">
            <span class="pmeal-ico">${icon(meal.icon, 'var(--green)', 18)}</span>
            <div class="pmeal-head">
              <span class="pmeal-type">${esc(meal.type)}${revised ? `<span class="rev-badge">${icon('refresh', 'var(--on-green)', 11)}Revised</span>` : ''}</span>
              <span class="pmeal-name">${esc(meal.name)}</span>
            </div>
            <span class="pmeal-kcal"><b>${meal.kcal}</b><span>${meal.serves > 1 ? 'kcal/serving' : 'kcal'}</span></span>
          </div>
          <p class="pmeal-desc">${esc(meal.desc)}</p>
          ${macroBars(meal)}
          <span class="ing-toggle">
            <span class="ing-toggle-l">Ingredients<span class="ing-count">${meal.ing.length}</span></span>
            <span class="ing-toggle-r">${open ? 'Hide' : 'View'}${icon('chev', 'var(--green)', 14)}</span>
          </span>
        </button>
        ${open ? `
          <div class="ing-list">
            <div class="serve-bar">
              <span class="serve-label">Servings</span>
              <div class="serve-seg">
                ${[1, 2, 4].map((n) => `<button class="serve-btn${meal.serves === n ? ' on' : ''}" data-action="serves" data-id="${esc(meal.id)}" data-serves="${n}">${n}</button>`).join('')}
              </div>
            </div>
            <div class="ing-rows">${ingredientRows(meal)}</div>
            <button class="pmeal-revise" data-action="revise-meal" data-id="${esc(meal.id)}">${icon('refresh', 'var(--green)', 16)}Revise this meal</button>
          </div>` : ''}
      </div>`;
  }

  function generatedPlanScreen() {
    const meals = currentMeals();
    const totals = planTotals(meals);
    const dislikes = (app.data.dislikes || []).slice(0, 3);
    const assumptions = dislikes.length ? [...PLAN_ASSUMPTIONS, `avoiding: ${dislikes.join(', ')}`] : PLAN_ASSUMPTIONS;
    return `
      <div class="screen plan-screen">
        <div class="home-top">
          <button class="icon-btn" data-action="plans-home" aria-label="New plan">${icon('plus', 'var(--ink)', 19)}</button>
          <div class="plan-toptitle"><span>Today's plan</span><span class="plan-topkcal">${totals.kcal.toLocaleString()} kcal · ${meals.length} meals</span></div>
          <span class="home-avatar">${esc(displayInitial())}</span>
        </div>
        <div class="plan-scroll">
          <div class="assume">
            <div class="assume-h">${icon('spark', 'var(--green)', 16)}Here's what I assumed</div>
            <ul>${assumptions.map((item) => `<li>${esc(item)}</li>`).join('')}</ul>
            <div class="assume-tip">Not quite right? Tap a tweak below or just tell me - e.g. "more Korean", "not spicy", "lighter".</div>
          </div>
          <div class="revise-row">
            ${REVISE_CHIPS.map((chip) => `<button class="revise-chip" data-action="revision-chip" data-value="${esc(chip)}">${icon('refresh', 'var(--green)', 15)}${esc(chip)}</button>`).join('')}
          </div>
          <div class="plan-list">
            ${meals.map((meal) => app.revisingId === meal.id ? skeletonCard(`Revising your ${TYPE_LABEL[meal.id]}...`) : mealCard(meal)).join('')}
          </div>
          <div class="plan-summary">
            <div class="psum-row">
              <span class="psum-k">Day total</span>
              <span class="psum-kcal">${totals.kcal.toLocaleString()}<span> kcal</span></span>
            </div>
            <div class="psum-macros">Protein ${totals.p}g · Fat ${totals.f}g · Carbs ${totals.c}g · ${meals.length} meals</div>
          </div>
          <button class="btn save-btn${app.planSaved ? ' done' : ''}" data-action="save-plan"${app.planSaved ? ' disabled' : ''}>
            ${app.planSaved ? `${icon('check', 'var(--green)', 17)}Saved to History` : `${icon('bookmark', 'var(--on-green)', 17)}Save this plan`}
          </button>
        </div>
        <div class="plan-footbar">${promptInput('followup-input', app.data.followup || '', 'Tell Mealwise what to change...')}</div>
        ${bottomNav('plans')}
      </div>`;
  }

  function historyMealRow(meal) {
    return `
      <div class="meal-row">
        <span class="meal-ico">${icon(meal.icon, 'var(--green)', 22)}</span>
        <span class="meal-main">
          <span class="meal-type">${esc(meal.type)}</span>
          <span class="meal-name">${esc(meal.name)}</span>
          <span class="meal-macros">${esc(meal.macros)}</span>
        </span>
        <span class="meal-kcal">${meal.kcal}<span>kcal</span></span>
      </div>`;
  }

  function historyScreen() {
    return `
      <div class="screen history">
        <div class="history-body">
          <h1 class="history-title">History</h1>
          <div class="history-sub">Last 3 days · ~2,000 kcal a day</div>
          ${HISTORY_DAYS.map((day) => `
            <section class="day-section">
              <div class="day-head">
                <div class="day-label">${esc(day.label)}</div>
                <div class="day-total">${day.total} kcal</div>
              </div>
              <div class="meal-list">
                ${day.meals.map(historyMealRow).join('')}
              </div>
            </section>`).join('')}
        </div>
        ${bottomNav('history')}
      </div>`;
  }

  function activeScreen() {
    const screen = STEPS[app.step];
    if (screen === 'welcome') return welcomeScreen();
    if (screen === 'email') return emailScreen();
    if (screen === 'code') return codeScreen();
    if (screen === 'name') return nameScreen();
    if (screen === 'tastes') return tastesScreen();
    if (screen === 'goals') return goalsScreen();
    if (screen === 'notes') return notesScreen();
    if (screen === 'done') return doneScreen();
    if (app.tab === 'history') return historyScreen();
    if (app.planView === 'loading') return planningScreen();
    if (app.planView === 'revising') return generatedPlanScreen();
    if (app.planView === 'plan') return generatedPlanScreen();
    return homeScreen();
  }

  function fit() {
    const pad = 40;
    app.scale = Math.min((window.innerWidth - pad) / 402, (window.innerHeight - pad) / 874, 1);
    const frame = document.getElementById('phone-scale');
    if (frame) frame.style.zoom = app.scale;
  }

  function render() {
    if (planTimer) {
      clearTimeout(planTimer);
      planTimer = null;
    }
    stage.innerHTML = `<div id="phone-scale" style="zoom:${app.scale}"><div class="app theme-b">${device(activeScreen())}</div></div>`;
    fit();
    if (app.tab === 'plans' && app.planView === 'loading') {
      planTimer = setTimeout(() => {
        if (app.tab !== 'plans' || app.planView !== 'loading') return;
        app.meals = baseMeals();
        app.planView = 'plan';
        render();
      }, 1200);
    }
    if (app.tab === 'plans' && app.planView === 'revising') {
      planTimer = setTimeout(() => {
        if (app.tab !== 'plans' || app.planView !== 'revising') return;
        const targetId = app.revisingId;
        const revision = app.pendingVariant
          ? { id: targetId, meal: app.pendingVariant }
          : interpretRevision(app.data.followup || app.pendingRevision || '');
        app.meals = currentMeals().map((meal) => meal.id === targetId ? normMeal(revision.meal, { revised: true }) : { ...meal, revised: false });
        app.planView = 'plan';
        app.revisedMeal = targetId;
        app.openMeals = { ...app.openMeals, [targetId]: true };
        app.scrollMeal = targetId;
        app.revisingId = null;
        app.pendingVariant = null;
        render();
      }, 1100);
    }
    if (app.scrollMeal !== null) {
      const mealId = app.scrollMeal;
      app.scrollMeal = null;
      setTimeout(() => {
        const body = document.querySelector('.plan-scroll');
        const card = document.querySelector(`[data-meal="${mealId}"]`);
        if (body && card) body.scrollTo({ top: card.offsetTop - 74, behavior: 'smooth' });
      }, 40);
    }
    if (app.adding) {
      const input = document.getElementById('add-dislike-input');
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }
  }

  function toggleListValue(key, value) {
    const list = app.data[key] || [];
    setData({ [key]: list.includes(value) ? list.filter((item) => item !== value) : [...list, value] });
  }

  function commitAdd() {
    const value = app.draft.trim();
    const dislikes = app.data.dislikes || [];
    if (value && !dislikes.includes(value)) app.data = { ...app.data, dislikes: [...dislikes, value] };
    app.adding = false;
    app.draft = '';
    save();
    render();
  }

  function startPlan(intent) {
    app.tab = 'plans';
    app.planView = 'loading';
    app.planIntent = intent || app.prompt || 'Asian food';
    app.planSaved = false;
    app.todayPlan = false;
    app.meals = [];
    app.openMeals = {};
    app.revisedMeal = null;
    app.revisingId = null;
    app.prompt = '';
    render();
  }

  function revisePlan(text, explicitId = '') {
    const request = (text || app.data.followup || app.pendingRevision || "I don't like cilantro").trim();
    const revision = explicitId ? { id: explicitId } : interpretRevision(request);
    const fallback = explicitId === 'b' ? ALT_MEALS.breakfast : explicitId === 'l' ? ALT_MEALS.lunch : ALT_MEALS.dinner;
    setData({ followup: request }, false);
    app.pendingRevision = request;
    app.pendingVariant = explicitId ? fallback : revision.meal;
    app.tab = 'plans';
    app.revisingId = revision.id;
    app.planView = 'revising';
    app.planSaved = false;
    render();
  }

  stage.addEventListener('click', (event) => {
    const target = event.target.closest('[data-action]');
    if (!target || !stage.contains(target)) return;
    const action = target.dataset.action;
    const value = target.dataset.value;
    const field = target.dataset.field;
    const tab = target.dataset.tab;
    const index = target.dataset.index;
    const id = target.dataset.id;
    const serves = Number(target.dataset.serves);

    if (action === 'next') go(Math.min(STEPS.length - 1, app.step + 1), 'fwd');
    if (action === 'back') go(Math.max(0, app.step - 1), 'back');
    if (action === 'skip') go(STEPS.indexOf('done'), 'fwd');
    if (action === 'finish') { app.tab = 'plans'; go(STEPS.indexOf('home'), 'fwd'); }
    if (action === 'restart') { app.planView = 'home'; app.planSaved = false; go(0, 'back'); }
    if (action === 'tab') { app.tab = tab || 'plans'; render(); }
    if (action === 'plans-home') { app.tab = 'plans'; app.planView = 'home'; render(); }
    if (action === 'open-today-plan') { app.tab = 'plans'; app.planView = 'plan'; render(); }
    if (action === 'prompt-send') startPlan(app.prompt || 'Asian food');
    if (action === 'start-plan') startPlan(value || app.prompt || 'Asian food');
    if (action === 'save-plan') { app.planSaved = true; app.todayPlan = true; render(); }
    if (action === 'followup-send') revisePlan(app.data.followup || "I don't like cilantro");
    if (action === 'revision-chip') revisePlan(value);
    if (action === 'revise-meal') revisePlan(`Revise ${TYPE_LABEL[id] || 'this meal'}`, id);
    if (action === 'resend-code') { app.codeResent = true; render(); }
    if (action === 'serves') {
      app.meals = currentMeals().map((meal) => meal.id === id ? { ...meal, serves } : meal);
      render();
    }
    if (action === 'toggle-meal') {
      const mealId = id || index;
      app.openMeals = { ...app.openMeals, [mealId]: !app.openMeals[mealId] };
      render();
    }
    if (action === 'toggle-dislike') toggleListValue('dislikes', value);
    if (action === 'toggle-style') toggleListValue('styles', value);
    if (action === 'start-add') { app.adding = true; app.draft = ''; render(); }
    if (action === 'commit-add') commitAdd();
    if (action === 'segment') setData({ [field]: value });
    if (action === 'kcal-down') setData({ kcal: Math.max(1200, (app.data.kcal || 2200) - 100) });
    if (action === 'kcal-up') setData({ kcal: Math.min(4000, (app.data.kcal || 2200) + 100) });
    if (action === 'append-note') {
      const notes = app.data.notes || '';
      setData({ notes: notes.trim() ? `${notes.replace(/\s+$/, '')}. ${value}` : value });
    }
  });

  stage.addEventListener('input', (event) => {
    if (event.target.id === 'email-input') {
      setData({ email: event.target.value }, false);
      const button = document.querySelector('.ob-foot .btn-primary');
      if (button) button.disabled = !emailValid(event.target.value);
    }
    if (event.target.classList.contains('otp-box')) {
      const boxes = [...document.querySelectorAll('.otp-box')];
      const index = Number(event.target.dataset.otp);
      event.target.value = event.target.value.replace(/\D/g, '').slice(0, 1);
      event.target.classList.toggle('filled', !!event.target.value);
      app.data.code = boxes.map((box) => box.value.replace(/\D/g, '').slice(0, 1)).join('').slice(0, 6);
      save();
      const button = document.querySelector('.ob-foot .btn-primary');
      if (button) button.disabled = app.data.code.length !== 6;
      if (event.target.value && boxes[index + 1]) boxes[index + 1].focus();
    }
    if (event.target.id === 'name-input') setData({ name: event.target.value }, false);
    if (event.target.id === 'home-prompt') app.prompt = event.target.value;
    if (event.target.id === 'followup-input') setData({ followup: event.target.value }, false);
    if (event.target.id === 'add-dislike-input') app.draft = event.target.value;
    if (event.target.id === 'notes-input') setData({ notes: event.target.value }, false);
  });

  stage.addEventListener('keydown', (event) => {
    if (event.target.id === 'email-input' && event.key === 'Enter' && emailValid(event.target.value)) go(app.step + 1, 'fwd');
    if (event.target.classList.contains('otp-box')) {
      const boxes = [...document.querySelectorAll('.otp-box')];
      const index = Number(event.target.dataset.otp);
      if (event.key === 'Backspace' && !event.target.value && boxes[index - 1]) boxes[index - 1].focus();
      if (event.key === 'ArrowLeft' && boxes[index - 1]) boxes[index - 1].focus();
      if (event.key === 'ArrowRight' && boxes[index + 1]) boxes[index + 1].focus();
      if (event.key === 'Enter' && (app.data.code || '').length === 6) go(app.step + 1, 'fwd');
    }
    if ((event.target.id === 'home-prompt' || event.target.id === 'followup-input') && event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      if (event.target.id === 'home-prompt') startPlan(app.prompt || 'Asian food');
      if (event.target.id === 'followup-input') revisePlan(app.data.followup || "I don't like cilantro");
    }
    if (event.target.id !== 'add-dislike-input') return;
    if (event.key === 'Enter') commitAdd();
    if (event.key === 'Escape') {
      app.adding = false;
      app.draft = '';
      render();
    }
  });

  stage.addEventListener('paste', (event) => {
    if (!event.target.classList.contains('otp-box')) return;
    const pasted = (event.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
    if (!pasted) return;
    event.preventDefault();
    app.data.code = pasted;
    save();
    render();
  });

  stage.addEventListener('focusout', (event) => {
    if (event.target.id === 'add-dislike-input') commitAdd();
  });

  window.addEventListener('resize', fit);
  fit();
  render();
  </script>
</body>
</html>
